<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="hackfloor: prove that agents which don't solve the task can't score">
  <rect width="1280" height="300" rx="18" fill="#ffffff"/>
  <!-- mark: two pillars standing on a floor -->
  <g transform="translate(80 78)">
    <rect width="144" height="144" rx="30" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
    <rect x="38" y="30" width="18" height="70" rx="4" fill="#1f2328"/>
    <rect x="88" y="30" width="18" height="70" rx="4" fill="#1f2328"/>
    <rect x="38" y="58" width="68" height="14" rx="4" fill="#1f2328"/>
    <rect x="24" y="108" width="96" height="8" rx="4" fill="#cf222e"/>
  </g>
  <text x="262" y="150" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="-2" fill="#1f2328">hack<tspan fill="#cf222e">floor</tspan></text>
  <text x="266" y="196" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#59636e">Prove that agents which don't solve the task can't score.</text>
  <text x="266" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#59636e">adversarial probes · matched controls · integrity cards</text>
  <!-- schematic: reward of each policy against the floor -->
  <g transform="translate(1000 60)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">
    <rect x="0" y="40" width="44" height="120" rx="5" fill="#1a7f37"/>
    <rect x="70" y="156" width="44" height="4" rx="2" fill="#afb8c1"/>
    <rect x="140" y="40" width="44" height="120" rx="5" fill="#cf222e"/>
    <path d="M156 16 l12 12 M168 16 l-12 12" stroke="#cf222e" stroke-width="3" stroke-linecap="round"/>
    <line x1="-14" y1="160" x2="198" y2="160" stroke="#59636e" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="22" y="186" text-anchor="middle" fill="#59636e">solve</text>
    <text x="92" y="186" text-anchor="middle" fill="#59636e">null</text>
    <text x="162" y="186" text-anchor="middle" fill="#59636e">hack</text>
    <text x="-20" y="165" text-anchor="end" fill="#59636e">floor</text>
      </g>
</svg>
