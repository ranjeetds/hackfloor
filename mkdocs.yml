site_name: hackfloor
site_description: Adversarial probes for RL environment graders and agent benchmarks.
site_url: https://ranjeetds.github.io/hackfloor/
repo_url: https://github.com/ranjeetds/hackfloor
repo_name: ranjeetds/hackfloor
edit_uri: edit/main/docs/
copyright: Apache-2.0 · Ranjeet Dhumal

theme:
  name: material
  features:
    - content.code.copy
    - content.action.edit
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts in plain words: concepts.md
  - Guides:
      - Adapters and supported targets: adapters.md
      - CI, pre-commit and pytest: ci.md
      - Bundled fixtures: fixtures.md
  - Results:
      - reasoning-gym 0.1.25: results/reasoning-gym.md
  - Reference:
      - Probes: probes.md
      - Integrity card: integrity-card.md
      - Statistics: statistics.md
      - Threat model and responsible use: threat-model.md
  - Project:
      - Background: background.md
      - How it compares: comparison.md
      - Roadmap: roadmap.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

validation:
  links:
    not_found: warn
    anchors: warn

extra_css:
  - stylesheets/extra.css
