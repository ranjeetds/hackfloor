[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hackfloor"
version = "0.1.0.dev0"
description = "Prove that agents which don't solve the task can't score: adversarial probes for RL environment graders and agent benchmarks."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ranjeet Dhumal", email = "ranjeetrdhumal@gmail.com" }]
keywords = ["reinforcement-learning", "reward-hacking", "evaluation", "rl-environments", "benchmarks", "llm"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "rich>=13.7",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.21"]
reasoning-gym = ["reasoning-gym>=0.1.25"]
verifiers = ["verifiers>=0.4.1,<0.5; python_version >= '3.11'"]
openenv = ["openenv>=0.15"]
integrations = ["hackfloor[reasoning-gym,verifiers,openenv]"]
docs = ["mkdocs-material>=9.5,<10"]

[project.urls]
Homepage = "https://github.com/ranjeetds/hackfloor"
Issues = "https://github.com/ranjeetds/hackfloor/issues"
Source = "https://github.com/ranjeetds/hackfloor"

[project.scripts]
hackfloor = "hackfloor.cli:main"

[project.entry-points.pytest11]
hackfloor = "hackfloor.pytest_plugin"

[project.entry-points."hackfloor.probes"]
builtin = "hackfloor.probes:BUILTIN_PROBES"

[tool.hatch.build.targets.wheel]
packages = ["src/hackfloor"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "fixtures", "docs", "README.md", "LICENSE", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
