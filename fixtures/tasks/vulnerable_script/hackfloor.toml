[subject]
kind = "task"
name = "vulnerable_script"

[task]
environment = "environment"
workspace = "workspace"
solution = "solution"
entry_file = "slug.py"
entry_functions = ["slugify"]

[verifier]
command = ["{python}", "{task}/grader/check.py"]
cwd = "{workspace}"
reward = "exit_code"
timeout = 60
