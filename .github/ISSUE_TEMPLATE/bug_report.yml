name: Bug report
description: hackfloor crashed, or produced output that looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected and what you got.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: hackfloor version
      placeholder: "output of `hackfloor version`"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
