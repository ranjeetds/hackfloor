name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      # With python-version set, setup-uv has already created and activated .venv,
      # so a second `uv venv` would fail without --clear.
      - run: uv pip install -e ".[dev]"
      - run: uv run pytest
      - name: Scan the fixtures
        run: |
          uv run hackfloor scan fixtures/tasks/fixed_pytest --out fixed-card.json
          uv run hackfloor scan fixtures/rlvr/fixed_math --out fixed-math-card.json
          if uv run hackfloor scan fixtures/tasks/vulnerable_pytest --out vuln-card.json; then
            echo "expected the vulnerable fixture to fail the scan" && exit 1
          fi
  integrations:
    # Adapters against the real verifiers, OpenEnv, reasoning-gym and Inspect AI packages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv pip install -e ".[dev,integrations]"
      - run: git clone --quiet --depth 1 --branch v0.15.0 https://github.com/openenv/OpenEnv.git "$RUNNER_TEMP/OpenEnv"
      - name: Integration tests (none may skip)
        env:
          HACKFLOOR_OPENENV_REPO: ${{ runner.temp }}/OpenEnv
        run: |
          uv run pytest tests/test_integrations.py -rs | tee integrations.txt
          if grep -q SKIPPED integrations.txt; then echo "an integration test was skipped" && exit 1; fi
